<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Intake Form - GamerSupps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 15px;
        }

        .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="number"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-list {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 13px;
        }

        .file-item button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .file-item button:hover {
            background: #c0392b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-message.show {
            opacity: 1;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .loading.show {
            opacity: 1;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        datalist {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sample Intake Form</h1>
        <p class="subtitle">This form must be submitted upon receipt of samples</p>

        <form id="intakeForm">
            <div class="form-section">
                <label for="productName">Product Name <span class="required">*</span></label>
                <input type="text" id="productName" name="productName" required>
            </div>

            <div class="form-section">
                <label for="sheetName">Inventory Category <span class="required">*</span></label>
                <select id="sheetName" name="sheetName" required>
                    <option value="">Select category</option>
                    <option value="Apparel">Apparel</option>
                    <option value="Side Items">Side Items</option>
                    <option value="Cups">Cups</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="manufacturer">Manufacturer</label>
                    <input type="text" id="manufacturer" name="manufacturer">
                </div>
                <div class="form-section">
                    <label for="sampleNo">Sample No. <span class="required">*</span></label>
                    <input type="text" id="sampleNo" name="sampleNo" required>
                </div>
            </div>

            <div class="form-section">
                <label for="brand">Brand <span class="required">*</span></label>
                <input type="text" id="brand" name="brand" list="brandList" required>
                <datalist id="brandList"></datalist>
            </div>

            <div class="form-section">
                <label for="photographer">Photographer</label>
                <input type="text" id="photographer" name="photographer" placeholder="Your name">
            </div>

            <div class="form-section">
                <label for="approvalStatus">Approval Status</label>
                <select id="approvalStatus" name="approvalStatus">
                    <option value="">Select status</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="currentLocation">Current Location <span class="required">*</span></label>
                    <select id="currentLocation" name="currentLocation" required>
                        <option value="">Select location</option>
                    </select>
                </div>
                <div class="form-section">
                    <label for="bulkStatus">Bulk Status</label>
                    <select id="bulkStatus" name="bulkStatus">
                        <option value="">Select status</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <label for="imageUpload">Reference Photos (Optional)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="imageUpload" name="imageUpload" accept="image/*" multiple>
                    <div id="fileList" class="file-list" style="display: none;"></div>
                </div>
            </div>

            <div class="loading" id="loading">
                <span class="spinner"></span>Submitting...
            </div>

            <button type="submit">Add to Inventory</button>
            <div class="status-message" id="statusMessage"></div>
        </form>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDwn7cdZBVMLsC8lyxhVp0nkci3KJYbiYNmzbihj2wt0_VV5BmuoGJqhlnrqLEr3x35g/exec';

        const form = document.getElementById('intakeForm');
        const loading = document.getElementById('loading');
        const statusMessage = document.getElementById('statusMessage');
        const imageUpload = document.getElementById('imageUpload');
        const fileList = document.getElementById('fileList');

        // Load dropdown options on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadDropdownOptions();
            setupImageUploadPreview();
        });

        function loadDropdownOptions() {
            const timestamp = new Date().getTime();
            fetch(SCRIPT_URL + '?t=' + timestamp)
                .then(response => response.json())
                .then(data => {
                    populateDropdown('brandList', data.brandList);
                    populateDropdown('approvalStatus', data.approvalStatusList);
                    populateDropdown('currentLocation', data.locationList);
                    populateDropdown('bulkStatus', data.bulkStatusList);
                })
                .catch(error => {
                    console.error('Error loading options:', error);
                });
        }

        function populateDropdown(elementId, options) {
            const element = document.getElementById(elementId);
            // Sort options alphabetically
            const sortedOptions = options.sort((a, b) => a.localeCompare(b));
            
            if (elementId === 'brandList') {
                const datalist = element;
                datalist.innerHTML = '';
                sortedOptions.forEach(option => {
                    const opt = document.createElement('option');
                    opt.value = option;
                    datalist.appendChild(opt);
                });
            } else {
                const select = element;
                const currentValue = select.value;
                select.innerHTML = '<option value="">Select option</option>';
                sortedOptions.forEach(option => {
                    const opt = document.createElement('option');
                    opt.value = option;
                    opt.textContent = option;
                    select.appendChild(opt);
                });
                if (currentValue) select.value = currentValue;
            }
        }

        function setupImageUploadPreview() {
            imageUpload.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    fileList.style.display = 'block';
                    fileList.innerHTML = '';
                    files.forEach((file, index) => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <span>${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                            <button type="button" onclick="removeFile(${index})">Remove</button>
                        `;
                        fileList.appendChild(fileItem);
                    });
                } else {
                    fileList.style.display = 'none';
                }
            });
        }

        function removeFile(index) {
            const dataTransfer = new DataTransfer();
            const files = Array.from(imageUpload.files);
            files.splice(index, 1);
            files.forEach(file => dataTransfer.items.add(file));
            imageUpload.files = dataTransfer.files;
            imageUpload.dispatchEvent(new Event('change', { bubbles: true }));
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            loading.classList.add('show');
            statusMessage.classList.remove('show', 'success', 'error');

            try {
                const formData = {
                    timestamp: new Date().toLocaleString(),
                    productName: document.getElementById('productName').value,
                    inventoryCategory: document.getElementById('sheetName').value,
                    manufacturer: document.getElementById('manufacturer').value,
                    brand: document.getElementById('brand').value,
                    sampleNo: document.getElementById('sampleNo').value,
                    photographer: document.getElementById('photographer').value,
                    approvalStatus: document.getElementById('approvalStatus').value,
                    currentLocation: document.getElementById('currentLocation').value,
                    bulkStatus: document.getElementById('bulkStatus').value,
                    imageUrls: []
                };

                // Handle image uploads if present
                const files = imageUpload.files;
                if (files.length > 0) {
                    // Upload images to Google Drive via Apps Script
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const base64 = await fileToBase64(file);
                        const imageResponse = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'uploadImage',
                                fileName: file.name,
                                fileData: base64,
                                productName: formData.productName,
                                brand: formData.brand,
                                inventoryCategory: formData.inventoryCategory
                            })
                        });
                        const imageResult = await imageResponse.json();
                        if (imageResult.success && imageResult.imageUrl) {
                            formData.imageUrls.push(imageResult.imageUrl);
                        }
                    }
                }

                // Submit form data
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    loading.classList.remove('show');
                    statusMessage.classList.add('show', 'success');
                    statusMessage.textContent = '✓ Successfully added to inventory!';
                    form.reset();
                    fileList.style.display = 'none';
                } else {
                    throw new Error('Request failed');
                }

                setTimeout(() => {
                    statusMessage.classList.remove('show');
                }, 4000);

            } catch (error) {
                loading.classList.remove('show');
                statusMessage.classList.add('show', 'error');
                statusMessage.textContent = '✗ Error: ' + error.message + '. Check console for details.';
                console.error('Form submission error:', error);

                setTimeout(() => {
                    statusMessage.classList.remove('show');
                }, 6000);
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
